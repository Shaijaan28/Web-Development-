<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex5</title>
    <style>
        body{
            background-color: black;
        }
        .box{
            background-color: rgb(252, 166, 180);
            width: 100vw;
            height: 100px;
            padding: 10px;
            position: sticky;
            top: 0;
        }
        .green{
            background-color: green;
            width: 100vw;
            height: 400px;
            padding: 30px;
            display: flex;
            gap: 50px;
            justify-content: center;
            box-sizing: border-box;
        }
        .box2{
            color: white;
            border: 3px solid white;
            border-radius: 10px;
            box-sizing: 100px;
            padding: 100px;
            ;
           
            text-align: center;
        }
        .box3{
            background-color: white;
            width: 100vw;
            height: 100px;
            padding: 10px;
            position: sticky;
        }
        .box4{
            width: 50px;
            height: 50px;
            background-color: orange;
            border-radius: 50%;
            right: 20px;
            bottom: 100px;
            position: fixed;
        }
        .gbox1{
            background-color: palevioletred;
            width: 40vw;
            height: 300px;
            padding: 20px;
           
        }
        .gbox2{
            background-color: blue;
            width: 40vw;
            height: 300px;
            padding: 20px;
           
        }
       

    </style>
</head>
<body>
    <div class="box"></div>
    <div class="green">
      <div class="gbox1"></div>
      <div class="gbox2"></div>
    </div>
    <div class="box2">
        Welcome to this Sigma Web Development Express
    </div>
    <div class="box3"></div>
    <div class="box4"></div>
</body>
</html>
