<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise5</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        header{
            position: sticky;
            top: 0;

        }
        nav{
            background-color: pink;
            height: 100px;
           
        }
        .container{
            background-color: green;
            margin: 12px 34px;
            padding: 55px 23px;
            text-align: center;
        }
        .box1{
           background-color: rgb(230, 71, 97); 
           height: 70vh;
           width: 45%;
           display: inline-block;
           margin: 0 12px;
        }
        .box2{
            background-color: blue;
             height: 70vh;
           width: 45%;
            display: inline-block;
            margin: 0 12px;

        }
        main{
            background-color: black;
            color: white;
            padding: 34px;
        }

        .text{
            padding: 34px;
            border: 2px solid white;
            
            margin: 10px 34vw;
            font-size: 2em;
            border-radius: 13px;
        }
        .icon{
            background-color: orange;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            bottom: 12px;
            right: 23px;
            position: fixed;
        }

        footer{
            height: 100px;
            background-color: bisque;
        }

    </style>
</head>
<body>
    <header>
        <nav>

        </nav>

    </header>

    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>

        <div class="text">
            <p>Welcome to Sigma web Development course</p>
        </div>

        <div class="icon"></div>

    </main>

    <footer>

    </footer>
</body>
</html>
