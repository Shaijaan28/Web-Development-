<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise2 CSS</title>
    <style>
        div p{
            color: red;
            background-color: yellow;
        }
        p:not(:first-child){
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body>
    <div>
        <p>I am first para</p>
        <p>I am another para</p>
        <p>I am another another  para</p>
        <p>I am another another another para</p>
        <p>I am another another another another para</p>
    </div>
</body>
</html>
