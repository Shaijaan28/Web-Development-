<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <style>
        /* Element Selector */
        /* div{
           background-color:  red;
        } */

        /* class selectors */
        .red{
            background-color: red;
         }

         /* ID selector */
         #green{
            background-color: green;
         }

         /* Child selectors */
         div > p{
            color: cyan;
            background-color: brown;
         }
         /* Descendant Selector */
         div p{
            color: blue;
            background-color: purple;
         }

         /* Univarsal Selectors */
         *{
            margin: 0;
            padding: 0;
         }
         /* Pseudo Selector */
         a:visited{
            color: yellow;
         }
         a:active{
            background-color: red;
         }
         a:hover{
            background-color: yellow;
         }

    </style>
<body>
    <div class="red">
        I am div
        <p>I am para inside div</p>
    </div>
    <div id="green">
        i am another div
    </div>
    <article>
        <p>I am another para</p>
    </article>
    <a href="https://www.google.com">Go to Google</a>
    <a href="https://www.facebok.com">Go to Facebook</a>
</body>
</html>
