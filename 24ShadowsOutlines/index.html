<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Outlines</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 15px  cyan;
           
        }
        .text_shadow{
            text-shadow: 2px 2px 4px red;
            border: 2px solid green;
            border-radius: 8px;
            outline-offset: 13px;
        }
    </style>
</head>
<body>
    <div class="box">
        I am a box
    </div>

    <p class="text_shadow">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Quo deserunt tempore rem officia. Error quas veniam autem corporis eligendi itaque possimus, unde voluptas ad ipsum cumque ipsam voluptate deleniti? Adipisci.
    </p>


</body>
</html>
